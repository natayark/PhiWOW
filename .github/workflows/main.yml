name: Build PhiWOW APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_HOME: ${{github.workspace}}/android-ndk-r26d

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip -q android-ndk-r26d-linux.zip -d ${{github.workspace}}

    - name: Install Rust
      uses: actions-rs/toolchain@v1.0.6
      with:
        toolchain: stable
        profile: minimal

    - name: Install targets
      run: |
        rustup target add aarch64-linux-android
        rustup target add armv7-linux-androideabi

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Build arm64-v8a .so
      run: |
        cd phire-ui
        cargo ndk -t arm64-v8a -o ./android/app/src/main/jniLibs build --release

    - name: Build armeabi-v7a .so
      run: |
        cd phire-ui
        cargo ndk -t armeabi-v7a -o ./android/app/src/main/jniLibs build --release

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Compile Java to DEX
      run: |
        SDK="${{github.workspace}}/android-sdk"
        BT="${{github.workspace}}/android-ndk-r26d/build-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
        mkdir -p $SDK/cmdline-tools
        unzip -q cmdtools.zip -d $SDK/cmdline-tools-tmp
        mv $SDK/cmdline-tools-tmp/cmdline-tools $SDK/cmdline-tools/latest

        # Accept licenses and install build-tools
        yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "build-tools;34.0.0" "platforms;android-34"

        BT="$SDK/build-tools/34.0.0"
        JAR="$SDK/platforms/android-34/android.jar"
        JAVA_HOME="${{env.JAVA_HOME}}"

        JAVAC="$JAVA_HOME/bin/javac"
        JAR_CMD="$JAVA_HOME/bin/jar"
        JAVA_CMD="$JAVA_HOME/bin/java"
        # Generate DEX using d8 (dx was removed in build-tools 34)
        $JAR_CMD cf build_classes.jar -C build_classes .
        $JAVA_CMD -cp "$DXJAR" com.android.tools.r8.d8.Main --min-api 21 --output origin/classes.dex build_classes.jar
        echo "DEX generation succeeded"

        $BT/aapt2 compile android/app/src/main/res/values/strings.xml -o compiled_strings.zip
        $BT/aapt2 link -o manifest_fixed.zip --manifest android/app/src/main/AndroidManifest.xml -I "$JAR" -R compiled_strings.zip --auto-add-overlay --rename-manifest-package com.hlmc.phire
        python3 -c "import zipfile; zipfile.ZipFile('manifest_fixed.zip','r').extract('AndroidManifest.xml','origin_temp')"
        cp origin_temp/AndroidManifest.xml origin/AndroidManifest.xml
        echo "Manifest processing succeeded"

    - name: Package APK
      run: python3 package_apk.py

    - name: Align and Sign
      run: |
        SDK="${{github.workspace}}/android-sdk"
        BT="$SDK/build-tools/34.0.0"
        $BT/zipalign -f 4 installed_raw.apk installed_aligned.apk
        $BT/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out installed.apk installed_aligned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PhiWOW-apk
        path: installed.apk
